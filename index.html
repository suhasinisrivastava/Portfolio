<style>
/* Layout: full-screen 3D model railway; name top-left, chapters top-right, train controller bottom-left, camera views bottom-right, chapter card slides in on the right (bottom sheet on phones).
   Deliberately single-theme: a dim hobby room, warm lamp light on a miniature layout. */
:root{
  --ink:#15110d; --glass:rgba(24,19,14,.8); --glass-2:rgba(40,31,24,.9); --line:rgba(255,236,214,.18);
  --text:#f6efe6; --muted:#d3c3ae; --signal:#f2c230; --red:#c8402f; --vdn:#5aa577; --vlr:#e3913a; --ggn:#8098ff;
  --paper:#f6efe3; --paper-ink:#221d18; --coach:#1f4e8c;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace; --body:'Hind',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 85% 75% at 50% 52%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
.ui{position:fixed;z-index:5}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{left:24px;top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;pointer-events:none}
.brand b{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.4vw,42px);line-height:1;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.brand span{font-family:var(--mono);font-size:13px;color:var(--muted);text-shadow:0 1px 10px rgba(0,0,0,.8)}
.nav{right:20px;top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:calc(100% - 40px)}
.pill{height:40px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none;color:var(--text)}
.pill:hover{border-color:rgba(255,236,214,.45)}
.pill .dot{width:9px;height:9px;border-radius:50%}
.pill[aria-pressed="true"]{background:var(--signal);color:#1c1b20;border-color:var(--signal)}
.ctl{left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:290px}
.ctl-top{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ctl-top strong{color:var(--text);font-size:20px;font-variant-numeric:tabular-nums}
.ctl-top .next{margin-left:auto;text-align:right}
.ctl-btns{display:flex;gap:8px}
.hold{flex:1;min-height:58px;border-radius:12px;border:0;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.hold small{font-family:var(--mono);font-weight:400;font-size:10px;margin-top:4px;opacity:.8;letter-spacing:0}
.hold.go{background:var(--signal);color:#1c1b20;box-shadow:0 4px 0 #9c7a17}
.hold.brake{background:var(--red);color:#fff;box-shadow:0 4px 0 #6e1f16}
.hold.horn{flex:0 0 64px;background:var(--glass-2);color:var(--text);border:1px solid var(--line);font-size:13px}
.hold.on{transform:translateY(3px);box-shadow:none}
.views{right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border-radius:14px;padding:6px;display:flex;gap:4px}
.views button{min-height:40px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-family:var(--mono);font-size:12px;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--text);color:#1c1b20}
.toast{left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));padding:10px 16px;border-radius:12px;font-family:var(--mono);font-size:13px;text-align:center;transition:opacity .3s,transform .3s}
.toast.hide{opacity:0;transform:translate(-50%,-8px);pointer-events:none}
.toast b{color:var(--signal)}
.tip{pointer-events:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;transform:translate(14px,14px)}
.card{right:20px;top:calc(76px + env(safe-area-inset-top,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100% - 40px));background:var(--paper);color:var(--paper-ink);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.card.hide{transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}
.card-head{padding:18px 18px 12px;display:flex;align-items:flex-start;gap:12px}
.card-head .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#6c6156}
.card-head h2{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:29px;line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.card-head .x{margin-left:auto;flex-shrink:0;width:40px;height:40px;border-radius:50%;border:1px solid #d6cab6;background:#fff;font-size:18px;line-height:1}
.board{margin:0 18px;padding:6px 12px;border:3px solid #1c1b20;border-radius:6px;background:var(--signal);color:#1c1b20;text-align:center;display:flex;flex-direction:column}
.board .hi{font-family:var(--body);font-weight:700;font-size:17px;line-height:1.25}
.board .en{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.08em;line-height:1.05}
.card-body{padding:14px 18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.55}
.card-body p{margin:0;color:#3b342d}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{font-size:14px;padding:3px 11px;border-radius:999px;background:#fff;border:1px solid #ddd0bc}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.facts div{background:#fff;border:1px solid #e2d7c5;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.facts span{font-family:var(--mono);font-size:11px;color:#6c6156}
.facts strong{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.sub{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#6c6156;margin-top:4px}
.tl{display:flex;flex-direction:column;margin-left:7px;border-left:2px solid #d6cab6}
.tl div{position:relative;padding:0 0 14px 18px;display:flex;flex-direction:column}
.tl div:last-child{padding-bottom:2px}
.tl div::before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--coach);box-sizing:border-box}
.tl div:first-child::before{background:var(--signal);border-color:#1c1b20}
.tl b{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2}
.tl span{font-family:var(--mono);font-size:12px;color:#6c6156}
.awards{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.awards li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;background:#fff;border:1px solid #e2d7c5;border-radius:10px;padding:9px 10px}
.awards li svg{margin-top:2px}
.awards b{font-weight:700;font-size:15px;line-height:1.3;display:block}
.awards small{font-family:var(--mono);font-size:11.5px;color:#6c6156}
.email{font-family:var(--mono);font-size:14px;user-select:all;padding:9px 12px;background:#fff;border:1px solid #e2d7c5;border-radius:8px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{height:42px;padding:0 14px;border-radius:10px;border:0;background:#221d18;color:#f6efe3;font-size:14px;display:inline-flex;align-items:center;text-decoration:none}
.btn.alt{background:#fff;color:#221d18;border:1px solid #d6cab6}
.loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ink);transition:opacity .6s}
.loader.done{opacity:0;pointer-events:none}
.loader b{font-family:var(--display);font-weight:800;font-size:28px}
.loader span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.loader .bar{width:200px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.loader .bar i{display:block;height:100%;width:40%;background:var(--signal);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.err{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--ink)}
@media (max-width:760px){
  .brand{left:16px}.nav{right:12px;top:calc(68px + env(safe-area-inset-top,0px));justify-content:flex-start;left:12px;max-width:none}
  .pill{height:36px;padding:0 11px;font-size:13px}
  .ctl{left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));min-width:0}
  .views{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));justify-content:center}
  .card{left:0;right:0;width:auto;top:auto;bottom:0;height:min(74%,600px);border-radius:18px 18px 0 0}
  .card.hide{transform:translateY(100%)}
  .toast{top:calc(160px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){.card,.toast{transition:none}.loader .bar i{animation:none}}
</style>

const hemi = new THREE.HemisphereLight('#f2ead8', '#2a1d14', .5); scene.add(hemi);
const rim = new THREE.DirectionalLight('#aec4ff', .7); rim.position.set(5, 3, -5); scene.add(rim);

/* ---------------- state ---------------- */
let s = STATIONS[0].s + 1.7, speed = 0, goHeld = false, brakeHeld = false, reverse = false, night = 0, nightTarget = 0;
let view = 'overview', prevView = 'overview', focusId = null, tween = null, lastStop = null;
const flags = {};
const VIEWS = {
  overview: { pos:[1.0, 3.5, 7.3], tgt:[0, -.05, .1] },
  vdn: { pos:[-.5, 1.85, 2.55], tgt:[-1.7, .28, -.25] },
  vlr: { pos:[1.15, 1.55, 2.25], tgt:[.22, .18, -.45] },
  ggn: { pos:[3.45, 1.85, 2.35], tgt:[2.05, .45, -.25] },
  contact: { pos:[2.55, .95, 3.05], tgt:[3.4, .1, 1.8] }
};

/* ---------------- UI wiring ---------------- */
let toastT;
function toast(html, ms = 3200){ const t = $('toast'); t.innerHTML = html; t.classList.remove('hide'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), ms); }
function openCard(id){
  const ch = CHAPTERS[id], c = $('card');
  c.innerHTML = `<div class="card-head"><div><div class="k">${ch.kicker}</div><h2>${ch.title}</h2></div><button class="x" type="button" id="closeCard" aria-label="Close">✕</button></div>
    <div class="board"><span class="hi">${ch.hi}</span><span class="en">${ch.en}</span></div>
    <div class="card-body">${ch.html()}</div>`;
  c.classList.remove('hide'); c.querySelector('.card-body').scrollTop = 0;
  $('closeCard').addEventListener('click', closeCard);
  const cb = $('copyEmail');
  if (cb) cb.addEventListener('click', () => navigator.clipboard.writeText(ME.email).then(() => cb.textContent = 'Copied').catch(() => { const rg = document.createRange(); rg.selectNodeContents($('emailTxt')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); cb.textContent = 'Selected: press Ctrl+C'; }));
  document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.go === id)));
}
function closeCard(){ $('card').classList.add('hide'); document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-pressed', 'false')); if (focusId){ focusId = null; setView(prevView); } }
function visit(id){ if (view !== 'focus') prevView = view; focusId = id; openCard(id); flyTo(VIEWS[id]); view = 'focus'; markViews(); }
function flyTo(v, dur = 1400){ tween = { from:{ pos:camera.position.clone(), tgt:controls.target.clone() }, to:{ pos:new THREE.Vector3(...v.pos), tgt:new THREE.Vector3(...v.tgt) }, t0:performance.now(), dur:reduce ? 1 : dur }; }
function setView(v){ view = v; focusId = null; if (v === 'overview') flyTo(VIEWS.overview); markViews(); }
function markViews(){ document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view))); }
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { $('card').classList.add('hide'); prevView = b.dataset.view; setView(b.dataset.view); }));
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => visit(b.dataset.go)));
$('lights').addEventListener('click', () => { nightTarget = nightTarget ? 0 : 1; $('lights').setAttribute('aria-pressed', String(!!nightTarget)); $('lights').textContent = nightTarget ? 'Lights on' : 'Lights off'; if (nightTarget) toast('Lights off. Watch the towns come alive.'); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCard(); });
function setGo(v){ goHeld = v; $('go').classList.toggle('on', v); if (v && view === 'focus'){ $('card').classList.add('hide'); focusId = null; setView(prevView); } }
function setBrake(v){ if (v && !brakeHeld) reverse = Math.abs(speed) < .002; brakeHeld = v; $('brake').classList.toggle('on', v); }
function bindHold(btn, fn){
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); fn(true); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, () => fn(false));
  btn.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); fn(true); } });
  btn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') fn(false); });
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}
bindHold($('go'), setGo); bindHold($('brake'), setBrake);
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea,button,a')) return;
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowRight' || k === 'd'){ e.preventDefault(); setGo(true); }
  else if (e.key === 'ArrowLeft' || k === 'a'){ e.preventDefault(); setBrake(true); }
  else if (k === 'h') horn();
});
addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (e.key === 'ArrowRight' || k === 'd') setGo(false); if (e.key === 'ArrowLeft' || k === 'a') setBrake(false); });
addEventListener('blur', () => { setGo(false); setBrake(false); });
let audio;
function horn(){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const now = audio.currentTime, g = audio.createGain(), lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.12, now + .05); g.gain.setValueAtTime(.12, now + .7); g.gain.linearRampToValueAtTime(0, now + .9);
    g.connect(lp); lp.connect(audio.destination);
    for (const f of [311, 370, 466]){ const o = audio.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(g); o.start(now); o.stop(now + .92); }
  } catch (_) {}
  toast('<b>Poooo!</b>', 1200);
}
$('horn').addEventListener('click', horn);

/* picking */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
const LABEL = { vdn:'Vindhyanagar · where it all began', vlr:'VIT Vellore · B.Tech CSE', ggn:'Gurgaon · Fareportal (CheapOAir)', train:'The train · hold GO to drive', horn:'Controller · sound the horn' };
const pickables = []; scene.traverse(o => { if (o.isMesh && o.userData.pick) pickables.push(o); });
function pick(e){
  const rc = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX - rc.left) / rc.width * 2 - 1, -(e.clientY - rc.top) / rc.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.pick : null;
}
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const id = pick(e); if (!id) return;
  if (id === 'train' || id === 'horn') horn(); else visit(id);
});
let lastMove = 0;
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || performance.now() - lastMove < 60) return; lastMove = performance.now();
  const id = pick(e), tip = $('tip');
  renderer.domElement.style.cursor = id ? 'pointer' : '';
  if (id){ tip.hidden = false; tip.textContent = LABEL[id]; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; } else tip.hidden = true;
});

/* ---------------- loop ---------------- */
const OV = [1.0, 3.5, 7.3];
function resize(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h); if (gtao) gtao.setSize(w, h);
  camera.aspect = w / h; camera.fov = w < 760 ? 48 : 32; camera.updateProjectionMatrix();
  const k = clamp(1.25 / camera.aspect, 1, 2.4) * (w < 760 ? .64 : 1); VIEWS.overview.pos = [OV[0] * k, .1 + (OV[1] - .1) * k, OV[2] * k]; controls.maxDistance = 11 * Math.max(1, k);
  tiltH.uniforms.h.value = (isMobile ? 1.2 : 2.2) / w; tiltV.uniforms.v.value = (isMobile ? 1.2 : 2.2) / h;
}
addEventListener('resize', resize); resize();
tiltH.uniforms.r.value = tiltV.uniforms.r.value = .46;
camera.position.set(...VIEWS.overview.pos); controls.target.set(...VIEWS.overview.tgt); controls.update();

const ACC = .3, BRK = 1.25, FRIC = .06, MAX = .9, REV = .25;
const bg = new THREE.Color(), dayBg = new THREE.Color('#15110d'), nightBg = new THREE.Color('#060508');
function signedDelta(a, b){ let d = a - b; d = ((d + L / 2) % L + L) % L - L / 2; return d; }
function physics(dt){
  if (goHeld && !brakeHeld) speed = speed < 0 ? Math.min(0, speed + BRK * dt) : Math.min(MAX, speed + ACC * dt);
  else if (brakeHeld){ if (reverse) speed = Math.max(-REV, speed - .3 * dt); else speed = speed > 0 ? Math.max(0, speed - BRK * dt) : Math.min(0, speed + BRK * dt); }
  else speed = speed > 0 ? Math.max(0, speed - FRIC * dt) : Math.min(0, speed + FRIC * dt);
  s = wrapS(s - speed * dt);
  let nextSt = null, nextD = 1e9;
  for (const st of STATIONS){
    const d = signedDelta(s, st.s);
    if (d > 0 && d < nextD){ nextD = d; nextSt = st; }
    const inZone = d <= .12 && d >= -.75;
    if (inZone && Math.abs(speed) < .002 && lastStop !== st.id){ lastStop = st.id; toast(`<b>${CHAPTERS[st.id].en}</b> · chapter unlocked`); visit(st.id); }
    if (!inZone && lastStop === st.id && Math.abs(d) > 1) lastStop = null;
    if (d > 1.2 && d < 1.6 && !flags['a' + st.id] && speed > .1){ flags['a' + st.id] = true; toast(`Next station: <b>${CHAPTERS[st.id].en}</b>. Brake to stop at the platform.`); }
    if (d > 2.5) flags['a' + st.id] = false;
    if (d < -.85 && d > -1.2 && speed > .15 && lastStop !== st.id && !flags['o' + st.id]){ flags['o' + st.id] = true; toast(`Missed <b>${CHAPTERS[st.id].en}</b>! Stop, then hold BRAKE to reverse.`); }
    if (d > 0) flags['o' + st.id] = false;
  }
  $('kmh').textContent = Math.round(Math.abs(speed) * 90);
  if (nextSt){ const n = CHAPTERS[nextSt.id].en; $('next').textContent = `Next: ${n.charAt(0) + n.slice(1).toLowerCase()} · ${(nextD * 100).toFixed(0)} m`; }
}
function placeTrain(dt){
  for (const c of trainCars){ const sc = s + c.off, p = P(sc), a = P(sc - .02); c.g.position.set(p.x, .045, p.z); c.g.lookAt(a.x, .045, a.z); }
  for (const w of wheels) w.rotation.x -= speed * dt / .024;
}
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
function cameraUpdate(dt){
  let tilt = view === 'overview' || view === 'focus';
  if (tween){
    const k = clamp((performance.now() - tween.t0) / tween.dur, 0, 1), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.from.pos, tween.to.pos, e); controls.target.lerpVectors(tween.from.tgt, tween.to.tgt, e);
    if (k >= 1) tween = null;
    controls.enabled = false; camera.lookAt(controls.target);
  } else if (view === 'follow' || view === 'cab'){
    controls.enabled = false;
    const t = Tn(s).multiplyScalar(-1), p = P(s);
    if (view === 'follow'){ tmpA.copy(p).addScaledVector(t, -1.4).add(new THREE.Vector3().crossVectors(UP, t).multiplyScalar(-.55)).setY(.72); tmpB.copy(P(s - .6)).setY(.12); camera.position.lerp(tmpA, 1 - Math.pow(.02, dt)); }
    else { tmpA.copy(p).addScaledVector(t, .02).setY(.205); tmpB.copy(P(s - 1.1)).setY(.12); camera.position.copy(tmpA); }
    controls.target.lerp(tmpB, view === 'cab' ? 1 : 1 - Math.pow(.01, dt)); camera.lookAt(controls.target);
  } else {
    controls.enabled = true; controls.minDistance = view === 'focus' ? .5 : 1.2; controls.update();
  }
  tiltH.enabled = tiltV.enabled = tilt;
  if (gtao) gtao.enabled = view !== 'cab';
}
function animate(t, dt){
  for (const pl of plumes){
    const ph = (t * .00009 * (pl.drift + .5) + pl.ph) % 1;
    pl.sp.position.set(pl.x + ph * pl.size * .9, pl.y + ph * pl.rise, pl.z - ph * pl.size * .3);
    pl.sp.scale.setScalar(pl.size * (.35 + ph * 1.1));
    pl.sp.material.opacity = Math.sin(ph * Math.PI) * .7 * (1 - .55 * night);
    pl.sp.material.color.setScalar(1 - .6 * night);
  }
  for (const p of palms) p.userData.crown.rotation.z = Math.sin(t * .0011 + p.position.x * 9) * .045;
  const d = new Date(); clockHands.hr.rotation.z = -((d.getHours() % 12) + d.getMinutes() / 60) / 12 * Math.PI * 2; clockHands.mn.rotation.z = -(d.getMinutes() / 60) * Math.PI * 2;
  // metro shuttles between ends and pauses
  const cyc = (t * .00006) % 2, u = cyc < 1 ? cyc : 2 - cyc, eased = u < .1 ? 0 : u > .9 ? 1 : (u - .1) / .8;
  metro.position.x = 1.45 + (2.75 - 1.45) * (eased * eased * (3 - 2 * eased));
  for (const c of cars){ c.x += c.dir * c.v * dt; if (c.x > 2.97) c.x = 1.22; if (c.x < 1.22) c.x = 2.97; c.g.position.set(c.x, 0, c.lane); c.g.rotation.y = c.dir > 0 ? 0 : Math.PI; }
  const blink = Math.sin(t * .004) > .3 ? 1 : .1; for (const b of blinkers) b.emissiveIntensity = blink * (1.2 + 2.5 * night);
  night += (nightTarget - night) * (1 - Math.pow(.15, dt));
  bg.copy(dayBg).lerp(nightBg, night); scene.background = bg; scene.fog.color.copy(bg);
  key.intensity = 120 - 108 * night; hemi.intensity = .5 - .42 * night; rim.intensity = .7 - .45 * night; scene.environmentIntensity = .42 - .34 * night;
  headlight.intensity = night * 5;
  for (const [m, a, b] of glowMats) m.emissiveIntensity = a + (b - a) * night;
  bloom.strength = .22 + night * .45; bloom.threshold = .92 - night * .25;
}
let last = performance.now(), started = false;
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  physics(dt); placeTrain(dt); animate(now, dt); cameraUpdate(dt);
  composer.render();
  if (!started){ started = true; setTimeout(() => { $('loader').classList.add('done'); toast('Hold <b>GO</b> to start the train, or click a town.', 4200); }, 250); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.fonts && document.fonts.ready.then(() => { for (const tex of boardTexes){ tex.userData.draw(tex.image.getContext('2d'), tex.image.width, tex.image.height); tex.needsUpdate = true; } });
window.__app = { visit, setView, set goHeld(v){ setGo(v); }, set brakeHeld(v){ setBrake(v); }, setNight(v){ night = nightTarget = v; }, setS(v){ s = v; }, STATIONS };
</script>
</body>
</html>
